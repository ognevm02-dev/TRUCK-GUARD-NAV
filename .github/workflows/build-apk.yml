name: Build TRUCK GUARD NAV APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir -p /tmp/truck-project
          ARCHIVE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ARCHIVE"
          unzip -q "$ARCHIVE" -d /tmp/truck-project
          PROJECT_DIR=$(find /tmp/truck-project -name settings.gradle -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .
      - name: Fix Java and Kotlin versions
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle
      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TRUCK-GUARD-NAV-APK
          path: app/build/outputs/apk/debug/app-debug.apk

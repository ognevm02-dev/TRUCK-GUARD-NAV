
name: Build TRUCK GUARD NAV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android
        uses: android-actions/setup-android@v4

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir -p /tmp/truck-project
          ARCHIVE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ARCHIVE"
          unzip -q "$ARCHIVE" -d /tmp/truck-project
          PROJECT_DIR=$(find /tmp/truck-project \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .

      - name: Add AndroidX Core dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          dependency = 'implementation "androidx.core:core-ktx:1.15.0"'

          if dependency not in s:
              marker = "dependencies {"
              if marker not in s:
                  raise SystemExit("Could not find dependencies block in app/build.gradle")
              s = s.replace(
                  marker,
                  marker + "\n    " + dependency,
                  1
              )

          p.write_text(s)
          PY

      - name: Set Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          replacement = """compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }"""

          if "compileOptions {" in s:
              s = re.sub(
                  r"compileOptions\s*\{.*?\}",
                  replacement,
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              block = """
              android {
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
              }
              """
              s += "\n" + block

          if "tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile)" not in s:
              s += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)
          PY

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: TRUCK-GUARD-NAV-APK
          path: app/build/outputs/apk/debug/app-debug.apk

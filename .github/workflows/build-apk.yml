
name: Build TRUCK GUARD NAV APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android
        uses: android-actions/setup-android@v4

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir -p /tmp/truck-project
          ARCHIVE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ARCHIVE"
          unzip -q "$ARCHIVE" -d /tmp/truck-project
          PROJECT_DIR=$(find /tmp/truck-project -name settings.gradle -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .

      - name: Fix Java version
        run: |
          printf '%s\n' \
            'tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {' \
            '    sourceCompatibility = "17"' \
            '    targetCompatibility = "17"' \
            '}' >> app/build.gradle

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: TRUCK-GUARD-NAV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
